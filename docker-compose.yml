name: hotel-offer-orchestrator

x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 3000
  REDIS_URL: redis://redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: hotel-offers
  TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: 30
  SUPPLIER_BASE_URL: http://api:3000
  SUPPLIER_TIMEOUT_MS: 3000
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  PARTIAL_CACHE_TTL_SECONDS: ${PARTIAL_CACHE_TTL_SECONDS:-30}
  HEALTH_CHECK_TIMEOUT_MS: 2000
  SHUTDOWN_TIMEOUT_MS: 10000

x-app-build: &app-build
  context: .
  target: runtime

services:
  api:
    build: *app-build
    image: hotel-offer-orchestrator:latest
    init: true
    environment: *app-environment
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build: *app-build
    image: hotel-offer-orchestrator:latest
    init: true
    command: ['node', 'dist/temporal/worker.js']
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - namespace
        - describe
        - --namespace
        - default
        - --address
        - temporal:7233
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.42.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8080}
    ports:
      - '${TEMPORAL_UI_PORT:-8080}:8080'
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temporal-postgres:
